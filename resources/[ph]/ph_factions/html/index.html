<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- ============ MENIU FACTIUNE ============ -->
    <div id="menu" class="hidden">
        <div class="win">
            <div class="head">
                <div>
                    <span id="f-name">Faction</span>
                    <span id="f-role" class="pill"></span>
                </div>
                <button id="close" class="x">&times;</button>
            </div>

            <div class="tabs" id="tabs"></div>

            <div class="body">
                <!-- Members -->
                <section class="tab" data-tab="members">
                    <div class="row-top">
                        <input id="mem-search" placeholder="Search member..." />
                        <button id="recruit" class="btn go">Recruit nearest</button>
                    </div>
                    <div id="members"></div>
                </section>

                <!-- Vehicles -->
                <section class="tab" data-tab="vehicles">
                    <div class="veh-cats">
                        <button class="vcat active" data-cat="car">Cars</button>
                        <button class="vcat" data-cat="heli">Helis</button>
                        <button class="vcat" data-cat="boat">Boats</button>
                    </div>
                    <div id="veh-add" class="row-top hidden">
                        <input id="va-model" placeholder="model (spawn name)" />
                        <input id="va-label" placeholder="display name" />
                        <input id="va-rank" type="number" min="1" max="7" value="1" title="minimum rank" />
                        <button id="va-go" class="btn go">Add</button>
                    </div>
                    <div id="vehicles"></div>
                </section>

                <!-- Ranks -->
                <section class="tab" data-tab="ranks">
                    <p class="muted">Names of the 7 ranks (1 = lowest, 7 = Leader). Only the leader can save.</p>
                    <div id="ranks"></div>
                    <button id="ranks-save" class="btn go">Save names</button>
                </section>

                <!-- Developer -->
                <section class="tab" data-tab="dev">
                    <div class="card">
                        <h4>Create faction</h4>
                        <div class="row-top">
                            <input id="dev-name" placeholder="Faction name" />
                            <button id="dev-create" class="btn go">Create</button>
                        </div>
                    </div>
                    <div class="card">
                        <h4>Configure the selected faction</h4>
                        <select id="dev-fac"></select>
                        <div class="dev-points">
                            <button class="btn" data-point="hqEnter">Set HQ Enter (my position)</button>
                            <button class="btn" data-point="hqExit">Set HQ Exit (my position)</button>
                            <button class="btn" data-point="vgarage">Set Car Garage</button>
                            <button class="btn" data-point="hgarage">Set Helipad</button>
                            <button class="btn" data-point="bgarage">Set Boat Dock</button>
                        </div>
                        <div class="row-top">
                            <input id="dev-leader" type="number" placeholder="leader sqlId" />
                            <button id="dev-setleader" class="btn">Set Leader</button>
                            <input id="dev-manager" type="number" placeholder="sqlId manager" />
                            <button id="dev-setmanager" class="btn">Set Manager</button>
                        </div>
                        <div class="row-top">
                            <input id="dev-seedrank" type="number" min="1" max="7" value="3" title="min rank" />
                            <button id="dev-seed" class="btn">Seed vanilla vehicles</button>
                            <button id="dev-delete" class="btn danger">Delete faction</button>
                        </div>
                    </div>
                </section>
            </div>

            <div class="foot"><span><b>Esc</b> close</span></div>
        </div>
    </div>

    <!-- ============ GARAJ ============ -->
    <div id="garage" class="hidden">
        <div class="win small">
            <div class="head">
                <span id="g-title">Garage</span>
                <button id="g-close" class="x">&times;</button>
            </div>
            <div id="g-list"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
