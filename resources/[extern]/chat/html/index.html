<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app">
        <div id="fps"></div>
        <div id="messages"></div>
        <div id="input-wrap" class="hidden">
            <input
                id="chat-input"
                type="text"
                maxlength="256"
                autocomplete="off"
                spellcheck="false"
                placeholder="Tasteaza un mesaj..."
            />
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
