<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- ============ MENIU FACTIUNE ============ -->
    <div id="menu" class="hidden">
        <div class="win">
            <div class="head">
                <div>
                    <span id="f-name">Factiune</span>
                    <span id="f-role" class="pill"></span>
                </div>
                <button id="close" class="x">&times;</button>
            </div>

            <div class="tabs" id="tabs"></div>

            <div class="body">
                <!-- Members -->
                <section class="tab" data-tab="members">
                    <div class="row-top">
                        <input id="mem-search" placeholder="Cauta membru..." />
                        <button id="recruit" class="btn go">Recruteaza cel mai apropiat</button>
                    </div>
                    <div id="members"></div>
                </section>

                <!-- Vehicles -->
                <section class="tab" data-tab="vehicles">
                    <div class="veh-cats">
                        <button class="vcat active" data-cat="car">Masini</button>
                        <button class="vcat" data-cat="heli">Heliuri</button>
                        <button class="vcat" data-cat="boat">Barci</button>
                    </div>
                    <div id="veh-add" class="row-top hidden">
                        <input id="va-model" placeholder="model (spawn name)" />
                        <input id="va-label" placeholder="nume afisat" />
                        <input id="va-rank" type="number" min="1" max="7" value="1" title="rank minim" />
                        <button id="va-go" class="btn go">Adauga</button>
                    </div>
                    <div id="vehicles"></div>
                </section>

                <!-- Ranks -->
                <section class="tab" data-tab="ranks">
                    <p class="muted">Denumirile celor 7 rank-uri (1 = jos, 7 = Leader). Doar liderul poate salva.</p>
                    <div id="ranks"></div>
                    <button id="ranks-save" class="btn go">Salveaza denumirile</button>
                </section>

                <!-- Developer -->
                <section class="tab" data-tab="dev">
                    <div class="card">
                        <h4>Creeaza factiune</h4>
                        <div class="row-top">
                            <input id="dev-name" placeholder="Nume factiune" />
                            <button id="dev-create" class="btn go">Creeaza</button>
                        </div>
                    </div>
                    <div class="card">
                        <h4>Configureaza factiunea selectata</h4>
                        <select id="dev-fac"></select>
                        <div class="dev-points">
                            <button class="btn" data-point="hqEnter">Set HQ Enter (pozitia mea)</button>
                            <button class="btn" data-point="hqExit">Set HQ Exit (pozitia mea)</button>
                            <button class="btn" data-point="vgarage">Set Garaj Auto</button>
                            <button class="btn" data-point="hgarage">Set Helipad</button>
                            <button class="btn" data-point="bgarage">Set Doc Barci</button>
                        </div>
                        <div class="row-top">
                            <input id="dev-leader" type="number" placeholder="sqlId lider" />
                            <button id="dev-setleader" class="btn">Set Leader</button>
                            <input id="dev-manager" type="number" placeholder="sqlId manager" />
                            <button id="dev-setmanager" class="btn">Set Manager</button>
                        </div>
                        <div class="row-top">
                            <input id="dev-seedrank" type="number" min="1" max="7" value="3" title="min rank" />
                            <button id="dev-seed" class="btn">Seed vehicule vanilla</button>
                            <button id="dev-delete" class="btn danger">Sterge factiunea</button>
                        </div>
                    </div>
                </section>
            </div>

            <div class="foot"><span><b>Esc</b> inchide</span></div>
        </div>
    </div>

    <!-- ============ GARAJ ============ -->
    <div id="garage" class="hidden">
        <div class="win small">
            <div class="head">
                <span id="g-title">Garaj</span>
                <button id="g-close" class="x">&times;</button>
            </div>
            <div id="g-list"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
