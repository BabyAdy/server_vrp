<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Purple Havoc</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app">
        <div class="bg-glow"></div>

        <header class="brand">
            <h1>PURPLE<span>HAVOC</span></h1>
            <p class="tag">R P G&nbsp;&nbsp;S E R V E R</p>
        </header>

        <!-- LOADING -->
        <section class="screen" id="screen-loading">
            <div class="card">
                <div class="spinner"></div>
                <p class="muted">Connecting to the server...</p>
            </div>
        </section>

        <!-- LOGIN -->
        <section class="screen" id="screen-login">
            <div class="card">
                <h2>Login</h2>
                <form id="form-login" autocomplete="off">
                    <label>Username
                        <input name="username" type="text" maxlength="24" required />
                    </label>
                    <label>Password
                        <input name="password" type="password" maxlength="64" required />
                    </label>
                    <p class="form-msg" id="msg-login"></p>
                    <button type="submit" class="btn primary">Enter game</button>
                </form>
                <p class="switch">No account? <a data-screen="register">Create one</a></p>
            </div>
        </section>

        <!-- REGISTER -->
        <section class="screen" id="screen-register">
            <div class="card">
                <h2>New account</h2>
                <form id="form-register" autocomplete="off">
                    <label>Username
                        <input name="username" type="text" maxlength="24" required />
                        <small>3-24 characters: letters, digits, _ (also your in-game name)</small>
                    </label>
                    <label>Email
                        <input name="email" type="email" maxlength="120" required />
                    </label>
                    <label>Password
                        <input name="password" type="password" maxlength="64" required />
                        <small>minimum 6 characters</small>
                    </label>
                    <label>Confirm password
                        <input name="password2" type="password" maxlength="64" required />
                    </label>
                    <p class="form-msg" id="msg-register"></p>
                    <button type="submit" class="btn primary">Create account</button>
                </form>
                <p class="switch">Already have an account? <a data-screen="login">Log in</a></p>
            </div>
        </section>

        <!-- CHARACTER CREATE -->
        <section class="screen" id="screen-charcreate">
            <div class="card wide">
                <h2>Create your character</h2>
                <p class="hint">You will play as <b id="cc-name">-</b></p>
                <form id="form-char" autocomplete="off">
                    <div class="row">
                        <label>Date of birth
                            <input name="dob" type="date" required />
                        </label>
                        <label>Gender
                            <select name="gender">
                                <option value="0">Male</option>
                                <option value="1">Female</option>
                            </select>
                        </label>
                    </div>
                    <label>Height: <span id="height-val">180</span> cm
                        <input name="height" type="range" min="140" max="220" value="180" step="1" />
                    </label>
                    <p class="form-msg" id="msg-char"></p>
                    <button type="submit" class="btn primary">Enter game</button>
                </form>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
