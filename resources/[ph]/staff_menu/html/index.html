<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="wrap" class="hidden">
        <div id="menu">
            <header>
                <div class="title">STAFF<span>MENU</span></div>
                <div class="me"><span id="me-name">-</span><b id="me-rank">-</b></div>
                <button id="close" title="Close (ESC)">✕</button>
            </header>

            <div id="body">
                <nav id="tabs"></nav>

                <main>
                    <!-- STAFF -->
                    <section class="tab" data-tab="staff">
                        <div class="target-bar">
                            Target: <b id="target-label">no player selected</b>
                            <span class="hint">— selecteaza din tab-ul Players</span>
                        </div>
                        <div id="staff-actions" class="btn-grid"></div>
                    </section>

                    <!-- TICKETS -->
                    <section class="tab" data-tab="tickets">
                        <div class="row-head">
                            <h3>Open tickets</h3>
                            <button class="mini" data-refresh="tickets">Refresh</button>
                        </div>
                        <div id="tickets-list" class="list"></div>
                    </section>

                    <!-- ACTIVE -->
                    <section class="tab" data-tab="active">
                        <div class="row-head">
                            <h3>My active tickets</h3>
                            <button class="mini" data-refresh="active">Refresh</button>
                        </div>
                        <div id="active-list" class="list"></div>
                    </section>

                    <!-- PLAYERS -->
                    <section class="tab" data-tab="players">
                        <div class="row-head">
                            <input id="player-search" placeholder="Search by SQL ID or Username..." />
                            <button class="mini" data-refresh="players">Refresh</button>
                        </div>
                        <div id="players-list" class="list"></div>
                    </section>

                    <!-- DEVELOPER -->
                    <section class="tab" data-tab="developer">
                        <div class="dev-block">
                            <h3>Set staff</h3>
                            <div class="inline">
                                <input id="dev-staff-src" type="number" placeholder="sql id (users.id)" />
                                <select id="dev-staff-grade"></select>
                                <button class="mini go" id="dev-staff-go">Apply</button>
                            </div>
                        </div>
                        <div class="dev-block">
                            <h3>Restart resource</h3>
                            <div class="inline">
                                <input id="dev-res" placeholder="resource name" />
                                <button class="mini go" id="dev-res-go">ensure</button>
                            </div>
                        </div>
                        <div class="dev-block">
                            <h3>Teleport to coordinates</h3>
                            <div class="inline">
                                <input id="dev-x" type="number" step="0.01" placeholder="x" />
                                <input id="dev-y" type="number" step="0.01" placeholder="y" />
                                <input id="dev-z" type="number" step="0.01" placeholder="z" />
                                <button class="mini" id="dev-fill">My coords</button>
                                <button class="mini go" id="dev-tp-go">TP</button>
                            </div>
                        </div>
                        <div class="dev-block">
                            <h3>Server info</h3>
                            <button class="mini" id="dev-info-go">Reload</button>
                            <div id="dev-info" class="info"></div>
                        </div>
                    </section>
                </main>
            </div>
        </div>

        <!-- MODAL -->
        <div id="modal" class="hidden">
            <div class="modal-card">
                <h3 id="modal-title">Action</h3>
                <label id="m-reason-w">Reason<textarea id="m-reason" rows="2"></textarea></label>
                <label id="m-days-w">Days (0 = permanent)<input id="m-days" type="number" min="0" value="0" /></label>
                <label id="m-text-w">Text<textarea id="m-text" rows="2"></textarea></label>
                <label id="m-ref-w">Ban ID or license<input id="m-ref" type="text" /></label>
                <div class="modal-actions">
                    <button id="m-cancel" class="mini">Cancel</button>
                    <button id="m-ok" class="mini go">Confirm</button>
                </div>
            </div>
        </div>

    </div>

    <!-- toast: in afara #wrap ca sa apara si cu meniul inchis (comenzi de vehicul, noclip) -->
    <div id="toast" class="hidden"></div>

    <!-- ===== NOCLIP HUD (se afiseaza si cu meniul inchis) ===== -->
    <div id="noclip-hud" class="hidden">
        <div class="nc-controls">
            <span class="nc-grp"><kbd>F2</kbd> Toggle Noclip</span>
            <span class="nc-sep"></span>
            <span class="nc-grp"><kbd>Q</kbd><kbd>E</kbd> Up / Down</span>
            <span class="nc-sep"></span>
            <span class="nc-grp"><kbd>W</kbd><kbd>S</kbd> Front / Back</span>
            <span class="nc-sep"></span>
            <span class="nc-grp"><kbd>L Shift</kbd> Speed</span>
        </div>
        <div class="nc-speed">
            <span class="nc-speed-cur">Speed <b id="nc-speed-name">Normal</b></span>
            <span class="nc-speed-lbl" id="nc-speed-lbl"></span>
            <span class="nc-tiers" id="nc-tiers"></span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
