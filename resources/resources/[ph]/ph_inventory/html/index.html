<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="inv" class="hidden">
        <div class="layout">

            <!-- STANGA: echipament + fast slots -->
            <div class="col left">
                <div id="equipment">
                    <div class="eq-col" id="eq-left"></div>
                    <div class="eq-figure"></div>
                    <div class="eq-col" id="eq-right"></div>
                    <div class="eq-bottom" id="eq-bottom"></div>
                </div>

                <div class="fast">
                    <h4>FAST SLOTS</h4>
                    <div id="hotbar"></div>
                </div>
            </div>

            <!-- CENTRU: inventar -->
            <div class="col center">
                <div class="c-head">
                    <span>INVENTORY ITEMS</span>
                    <span id="weight">0/0</span>
                </div>
                <div id="weight-bar"><i></i></div>
                <div class="search"><input id="search" placeholder="Search items..." /></div>
                <div id="grid"></div>
            </div>

            <!-- DREAPTA: nearby + drop -->
            <div class="col right">
                <div class="c-head"><span>NEARBY ITEMS</span></div>
                <div id="nearby"></div>
                <div id="dropzone">
                    <div class="dz-ico">⬇</div>
                    <div>DROP ITEMS</div>
                </div>
            </div>
        </div>

        <div class="foot">
            <span>🖱 Move items</span>
            <span>🖱 Item options</span>
            <span><b>Esc</b> Close</span>
        </div>

        <!-- context menu -->
        <div id="ctx" class="hidden">
            <button data-op="use">Use</button>
            <button data-op="split">Split</button>
            <button data-op="drop">Drop</button>
        </div>

        <!-- split / drop count -->
        <div id="countbox" class="hidden">
            <label>Cantitate<input id="count-input" type="number" min="1" value="1" /></label>
            <div class="cb-actions">
                <button id="cb-cancel">Anuleaza</button>
                <button id="cb-ok">OK</button>
            </div>
        </div>

        <!-- weapon tooltip -->
        <div id="tip" class="hidden"></div>

        <!-- drag ghost -->
        <div id="ghost" class="hidden"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
