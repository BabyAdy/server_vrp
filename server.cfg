# ==========================================================
#  PURPLE HAVOC - RPG SERVER
#  server.cfg
# ==========================================================

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_maxclients 48
## [txAdmin CFG validator]: onesync MUST only be set in the txAdmin settings page.
# onesync on

sv_hostname "Purple Havoc | RPG | WIP"
sets sv_projectName "Purple Havoc"
sets sv_projectDesc "GTA V RPG server - progression, levels, skills"

# Build-ul de joc (schimba daca ai nevoie de alt DLC)
sv_enforceGameBuild 3407

# ----------------------------------------------------------
#  DE COMPLETAT (tu)
# ----------------------------------------------------------
# Cheia de licenta de pe https://keymaster.fivem.net/
sv_licenseKey "cfxk_1GnJtCahPb80xHTvCnZKZ_4Fhef3"

# Optional (lasa comentat daca nu ai cheie Steam)
# set steam_webApiKey ""

# String-ul de conexiune MySQL (oxmysql)
# Format: mysql://USER:PAROLA@HOST/NUME_DB?charset=utf8mb4
set mysql_connection_string "mysql://root:@localhost/purple_havoc?charset=utf8mb4"

# ----------------------------------------------------------
#  Locale / tags
# ----------------------------------------------------------
sets locale "ro-RO"
sets tags "rpg, progression, romania"

# ----------------------------------------------------------
#  Permisiuni
# ----------------------------------------------------------
add_ace group.admin command allow
add_ace group.admin ph.admin allow
# Pune-ti identificatorul tau ca sa ai acces admin (ex: /phresetchar)
# add_principal identifier.fivem:0000000 group.admin

# ==========================================================
#  RESURSE
# ==========================================================
# Dependinta (o instalezi tu - vezi nota de mai jos)
ensure oxmysql

# Core-ul Purple Havoc
ensure ph-core
ensure loading_screen

# Resurse gameplay (resources/[ph])
ensure ph_chat
ensure ph_hud
