<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purple Havoc — Loading</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<!-- intro video - se aude DIRECT din clip (introv2.mp4), fara .mp3 separat -->
<div class="bg">
    <video id="bgVideo" src="introv2.mp4" autoplay loop playsinline preload="auto"></video>
    <div class="bg-grad"></div>
    <div class="bg-vignette"></div>
    <div class="bg-grid"></div>
</div>

<div id="audioCtl">
    <button id="muteBtn" title="Mute / Unmute">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path id="mIco" d="M11 5 6 9H2v6h4l5 4V5z M15.5 8.5a5 5 0 0 1 0 7 M19 5a10 10 0 0 1 0 14"/>
        </svg>
    </button>
    <input type="range" id="volSlider" min="0" max="100" value="35" title="Volum intro">
</div>

<main class="panel">
    <header class="brand">
        <img id="logo" src="logo.png" alt="">
        <div class="brand-txt">
            <h1>Purple Havoc</h1>
            <span>Community</span>
        </div>
    </header>

    <section class="links">
        <div class="link">
            <span class="k">Discord</span>
            <b class="v">discord.gg/purple-havoc</b>
        </div>
        <div class="link">
            <span class="k">UCP</span>
            <b class="v">ucp.puple-havoc.ro</b>
        </div>
    </section>

    <section class="staff" id="staff"></section>
</main>

<footer class="loader">
    <div class="l-top">
        <span class="l-status" id="status">Connecting…</span>
        <span class="l-pct" id="pct">0%</span>
    </div>
    <div class="l-bar"><i id="bar"></i></div>
    <span class="l-credit">Developed by: BabyAdy</span>
</footer>

<script src="script.js"></script>
</body>
</html>
