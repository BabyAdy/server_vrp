<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="hud" class="hidden">

        <!-- DREAPTA SUS -->
        <div id="tr">
            <div class="pid">[ID: <span id="pid">0</span>]</div>
            <div class="pline">
                <span class="k">Player</span>
                <span id="pname">-</span>
            </div>
            <div class="srv">
                <span class="dot"></span>
                <span id="online">0</span> online
                <span id="server" class="brand">PURPLE HAVOC</span>
            </div>
            <div class="clock">
                <span id="time">00:00</span>
                <span class="sep">—</span>
                <span id="date">-</span>
            </div>
            <div class="wallet">
                <div class="w"><span class="k">Cash</span><span id="cash" class="cash">$0</span></div>
                <div class="w"><span class="k">Bank</span><span id="bank" class="bank">$0</span></div>
            </div>

            <div id="statuses"></div>
        </div>

        <!-- STANGA JOS (langa minimap) -->
        <div id="bl">
            <div class="toprow">
                <div class="paycheck"><span class="k">Paycheck</span><span id="paycheck">00:00</span></div>
                <div id="mic" class="mic" title="Microfon">MIC</div>
            </div>

            <div class="bar" data-b="hp">
                <span class="k">Health</span>
                <div class="track"><i id="hp"></i></div>
                <span id="hpv" class="v">0%</span>
            </div>
            <div class="bar" data-b="ar">
                <span class="k">Armor</span>
                <div class="track"><i id="ar"></i></div>
                <span id="arv" class="v">0%</span>
            </div>
            <div class="bar" data-b="hu">
                <span class="k">Food</span>
                <div class="track"><i id="hu"></i></div>
                <span id="huv" class="v">0%</span>
            </div>
            <div class="bar" data-b="th">
                <span class="k">Water</span>
                <div class="track"><i id="th"></i></div>
                <span id="thv" class="v">0%</span>
            </div>
        </div>

        <!-- SPEEDOMETER (dreapta jos, langa minimap-ul opus) -->
        <div id="veh" class="hidden">
            <div class="spd">
                <span id="v-kmh">0</span>
                <span class="u">KM/H</span>
                <span id="v-gear" class="gear">N</span>
            </div>
            <div class="rpm"><i id="v-rpm"></i></div>
            <div class="chips">
                <div class="chip" id="c-eng" title="Engine">
                    <svg viewBox="0 0 24 24"><path d="M5 9h2l2-2h4l1 2h3v3h2v4h-2v2h-4l-2 2H8v-4H5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
                </div>
                <div class="chip" id="c-fuel" title="Fuel">
                    <svg viewBox="0 0 24 24"><path d="M4 20V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v14M3 20h12M14 9h2.5A1.5 1.5 0 0 1 18 10.5V17a2 2 0 0 0 4 0V8l-3-3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                    <b id="v-fuel">100%</b>
                </div>
                <div class="chip" id="c-lights" title="Lights">
                    <svg viewBox="0 0 24 24"><path d="M3 12h3m12 0h3M8 7c3-2 5-2 5 5s-2 7-5 5a6 6 0 0 1 0-10z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <div class="chip" id="c-lock" title="Lock">
                    <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
                    <span id="v-lock">—</span>
                </div>
                <div class="chip" id="c-belt" title="Seatbelt">
                    <svg viewBox="0 0 24 24"><path d="M6 4l12 16M18 4L6 20M5 4h4M15 20h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                    <span>BELT</span>
                </div>
            </div>
            <div class="odo" id="v-odo"><span>ODO</span> <b>0.0</b> km <span id="v-plate" class="plate"></span></div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
