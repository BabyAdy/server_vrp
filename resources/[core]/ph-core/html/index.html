<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Purple Havoc</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app">
        <div class="bg-glow"></div>

        <header class="brand">
            <h1>PURPLE<span>HAVOC</span></h1>
            <p class="tag">R P G&nbsp;&nbsp;S E R V E R</p>
        </header>

        <!-- LOADING -->
        <section class="screen" id="screen-loading">
            <div class="card">
                <div class="spinner"></div>
                <p class="muted">Se conecteaza la server...</p>
            </div>
        </section>

        <!-- LOGIN -->
        <section class="screen" id="screen-login">
            <div class="card">
                <h2>Autentificare</h2>
                <form id="form-login" autocomplete="off">
                    <label>Username
                        <input name="username" type="text" maxlength="20" required />
                    </label>
                    <label>Parola
                        <input name="password" type="password" maxlength="64" required />
                    </label>
                    <p class="form-msg" id="msg-login"></p>
                    <button type="submit" class="btn primary">Intra in joc</button>
                </form>
                <p class="switch">Nu ai cont? <a data-screen="register">Creeaza unul</a></p>
            </div>
        </section>

        <!-- REGISTER -->
        <section class="screen" id="screen-register">
            <div class="card">
                <h2>Cont nou</h2>
                <form id="form-register" autocomplete="off">
                    <label>Username
                        <input name="username" type="text" maxlength="24" required />
                        <small>3-24 caractere: litere, cifre, _ (este si numele in joc)</small>
                    </label>
                    <label>Email
                        <input name="email" type="email" maxlength="120" required />
                    </label>
                    <label>Parola
                        <input name="password" type="password" maxlength="64" required />
                        <small>minim 6 caractere</small>
                    </label>
                    <label>Confirma parola
                        <input name="password2" type="password" maxlength="64" required />
                    </label>
                    <p class="form-msg" id="msg-register"></p>
                    <button type="submit" class="btn primary">Creeaza cont</button>
                </form>
                <p class="switch">Ai deja cont? <a data-screen="login">Autentifica-te</a></p>
            </div>
        </section>

        <!-- CHARACTER CREATE -->
        <section class="screen" id="screen-charcreate">
            <div class="card wide">
                <h2>Creeaza-ti personajul</h2>
                <p class="hint">Vei juca sub numele <b id="cc-name">-</b></p>
                <form id="form-char" autocomplete="off">
                    <div class="row">
                        <label>Data nasterii
                            <input name="dob" type="date" required />
                        </label>
                        <label>Gen
                            <select name="gender">
                                <option value="0">Masculin</option>
                                <option value="1">Feminin</option>
                            </select>
                        </label>
                    </div>
                    <label>Inaltime: <span id="height-val">180</span> cm
                        <input name="height" type="range" min="140" max="220" value="180" step="1" />
                    </label>
                    <p class="form-msg" id="msg-char"></p>
                    <button type="submit" class="btn primary">Intra in joc</button>
                </form>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
